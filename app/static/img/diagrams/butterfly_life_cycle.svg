<svg viewBox="0 0 520 420" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Verdana, sans-serif">
  <rect width="520" height="420" fill="#ffffff"/>
  <text x="260" y="32" text-anchor="middle" font-size="20" font-weight="700" fill="#1f2937">Butterfly Life Cycle</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4f46e5"/>
    </marker>
  </defs>

  <path d="M300,110 Q400,130 415,165" stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M415,245 Q400,300 320,320" stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M200,320 Q120,300 105,245" stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <path d="M105,165 Q120,130 220,110" stroke="#4f46e5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

  <circle cx="260" cy="95" r="58" fill="#fef9c3" stroke="#eab308" stroke-width="2"/>
  <text x="260" y="90" text-anchor="middle" font-size="32">🥚</text>
  <text x="260" y="118" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">1. Egg</text>

  <circle cx="435" cy="205" r="58" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="435" y="200" text-anchor="middle" font-size="32">🐛</text>
  <text x="435" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">2. Larva</text>

  <circle cx="260" cy="335" r="58" fill="#fde8d0" stroke="#c2410c" stroke-width="2"/>
  <rect x="246" y="303" width="28" height="46" rx="13" fill="#c2853f"/>
  <line x1="260" y1="303" x2="260" y2="290" stroke="#8a5a26" stroke-width="2"/>
  <text x="260" y="368" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">3. Pupa (Chrysalis)</text>

  <circle cx="85" cy="205" r="58" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="85" y="200" text-anchor="middle" font-size="32">🦋</text>
  <text x="85" y="228" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2937">4. Adult</text>
</svg>
